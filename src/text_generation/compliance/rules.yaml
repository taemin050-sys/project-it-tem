# 1차 규제 검수 금지어 사전 (v0.3)
# 기준 : 화장품 표시·광고 관리 지침 (민원인 안내서, 2025.8.14) + 화장품법 시행규칙 [별표 5] + 식약처 자주하는 질문집·뉴스레터
# - patterns : 정규식 (대소문자 무시)
# - risk : 위반 의심 → 승인 차단 / 근거 확인 필요 → 경고만
# - reason : 사용자 화면에 보여줄 설명 (왜 문제인지)
# - suggestion : 대체 표현 예시, 원래 표현 자리에 바꿔 넣을 수 있는 짧은 말 (여러 개는 ' / '로 구분, null이면 삭제 권장)
# - basis : 근거 위치 (지침 쪽수, 질문집 문항 번호·인쇄 쪽수)
# - source : 아래 sources의 이름 (null이면 링크 없음)
# - except_with : 같은 문장에 이 단어가 모두 있으면 검수 제외 (선택)

sources:
  guideline:
    title: "화장품 표시·광고 관리 지침 (민원인 안내서, 2025.8.14)"
    url: "https://www.mfds.go.kr/brd/m_1060/view.do?seq=15700"
  enforcement_rule:
    title: "화장품법 시행규칙 [별표 5] 화장품 표시·광고의 범위 및 준수사항"
    url: "https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%ED%99%94%EC%9E%A5%ED%92%88%EB%B2%95+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0005&bylBrNo=00&bylCls=BE"
  faq_2025:
    title: "2025 자주하는 질문집 (화장품)"
    url: "https://www.mfds.go.kr/brd/m_1060/view.do?seq=15772"
  faq_2024:
    title: "2024 자주하는 질문집 (화장품)"
    url: "https://www.mfds.go.kr/brd/m_1060/view.do?seq=15581"
  newsletter_34:
    title: "식약처 컨슈머 뉴스레터 34호 (화장품 구매 시 과장 광고 주의)"
    url: "https://www.mfds.go.kr/brd/m_768/view.do?seq=3673"

rules:
  # ---------- 의약품 오인 (별표 1, 제13조 제1항 제1호) ----------
  - id: drug_disease
    patterns: ["아토피", "건선", "소양증", "모낭충", "기저귀\\s*발진", "atopy", "피부염", "습진"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "질병 이름은 화장품을 질병 치료제로 오인하게 할 수 있어 금지됩니다."
    suggestion: null
    basis: "지침 별표1 p.9"
    source: guideline

  - id: drug_treatment
    patterns: ["치료", "치유", "처치", "완치", "heal(ing)?", "\\bcure[sd]?\\b"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "치료·치유는 의약품의 효능이므로 화장품 광고에 사용할 수 없습니다."
    suggestion: "건강한 피부 / 피부 컨디션 케어"
    basis: "지침 별표1 p.9~11"
    source: guideline

  - id: drug_inflammation
    patterns: ["항염", "소염", "염증", "진통", "통증\\s*(경감|완화)", "살균", "소독", "항진균", "항바이러스", "항알레르기", "면역\\s*(강화|력)", "anti[\\s-]*inflammatory"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "염증·통증 완화, 살균, 면역 관련 표현은 의약품의 효능이므로 화장품 광고에 사용할 수 없습니다."
    suggestion: null
    basis: "지침 별표1 p.9"
    source: guideline

  - id: drug_antibacterial
    patterns: ["항균"]
    category: 의약품 오인
    risk: 근거 확인 필요
    reason: "'항균'은 인체세정용 제품이 시험 자료를 갖춘 경우에만 사용할 수 있습니다."
    suggestion: null
    basis: "지침 별표1 p.9, 별표2 p.15"
    source: guideline

  - id: drug_regeneration
    patterns: ["(피부|세포)\\S{0,2}\\s*재생", "재생\\s*(효과|크림|케어)", "\\bregenerat\\w*", "세포\\s*(활성|성장)", "DNA\\s*활성", "혈액\\s*순환", "호르몬"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "피부·세포 재생, 혈액순환, 호르몬 관련 표현은 의약품으로 오인할 수 있어 금지됩니다."
    suggestion: "촉촉한 피부결 / 피부 컨디션 케어"
    basis: "지침 별표1 p.11"
    source: guideline

  - id: drug_damage_recovery
    patterns: ["(손상|상처|흉터|반흔)\\S*\\s*(을|를)?\\s*(회복|복구|치료|제거|완화)", "흉터", "반흔"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "상처·흉터를 회복하거나 없앤다는 표현은 일부 단어만 사용해도 의약품 오인 표현에 해당합니다."
    suggestion: null
    basis: "지침 별표1 p.10"
    source: guideline

  - id: drug_detox
    patterns: ["디톡스", "detox", "독소\\s*(를|을)?\\s*(제거|배출)", "해독", "체내\\s*노폐물"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "체내 독소·노폐물을 제거한다는 표현은 금지됩니다. 피부·모공 노폐물을 씻어낸다는 표현은 사용할 수 있습니다."
    suggestion: "모공 노폐물 세정 / 깨끗한 세정"
    basis: "지침 별표1 p.9~10, p.13"
    source: guideline

  - id: drug_name
    patterns: ["의약품", "메디슨", "medicine", "드럭", "\\bdrug\\b", "코스메슈티컬", "cosmeceutical"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "의약품을 뜻하는 단어(메디슨, 드럭, 코스메슈티컬 등)는 화장품 광고에 사용할 수 없습니다."
    suggestion: null
    basis: "지침 별표1 p.11"
    source: guideline

  # 브랜드명 안의 메드·Medi는 검수 제외 (rule_checker의 브랜드명 보호), 본문은 전체 인상으로 판단
  - id: drug_med
    patterns: ["\\bmed\\b", "메드\\b"]
    category: 의약품 오인
    risk: 근거 확인 필요
    reason: "'메드'라는 단어만으로 위반은 아니지만, 광고 전체가 의약품으로 오인되면 위반이 될 수 있습니다."
    suggestion: null
    basis: "2025 질문집 Q318 (p.205)"
    source: faq_2025

  - id: drug_body
    patterns: ["다이어트", "체중\\s*감량", "지방\\s*분해", "체형\\s*변화", "몸매\\s*개선", "가슴\\s*(탄력|확대)", "얼굴\\s*(크기|이)\\s*작아", "슬리밍"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "체중 감량, 지방 분해, 체형 변화는 화장품의 효과 범위를 벗어나므로 사용할 수 없습니다."
    suggestion: null
    basis: "지침 별표1 p.11"
    source: guideline

  - id: drug_hair
    patterns: ["발모", "육모", "양모", "(모발|머리카락|속눈썹|눈썹)\\S*\\s*(이|가)?\\s*(\\S+\\s+)?(자란|자라|성장|굵어)", "모발\\s*두께"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "털이 자라거나 굵어진다는 표현은 의약품의 효능이므로 사용할 수 없습니다."
    suggestion: null
    basis: "지침 별표1 p.10"
    source: guideline

  - id: drug_body_function
    patterns: ["(심신\\s*)?피로\\s*회복", "림프", "땀\\S{0,3}\\s*(분비|발생)?\\S{0,2}\\s*억제", "이뇨", "항암", "근육\\s*이완", "관절\\s*(통증|건강|케어)", "화상", "찰과상", "유익균\\S{0,2}\\s*균형", "질염"]
    category: 의약품 오인
    risk: 위반 의심
    reason: "피로 회복, 림프 순환, 땀 억제 등 피부 밖 신체 기능에 대한 효능은 의약품으로 오인할 수 있어 금지됩니다."
    suggestion: null
    basis: "지침 별표1 p.9, p.11"
    source: guideline

  # ---------- 별표 2 실증 대상 (근거 확인 필요) ----------
  - id: proof_aging
    patterns: ["안티\\s*에이징", "anti-?aging", "(피부)?\\s*노화\\s*(완화|방지|개선|감소|징후)", "탄력\\s*(개선|회복|강화)", "콜라겐\\s*(증가|생성|활성|부스팅)", "효소\\s*(증가|활성)"]
    category: 효능 과장
    risk: 근거 확인 필요
    reason: "노화 방지·탄력 개선 표현은 인체 적용시험 자료가 있어야 사용할 수 있습니다."
    suggestion: "탄탄해 보이는 / 생기 있는"
    basis: "지침 별표1 p.10, 별표2 p.15"
    source: guideline

  - id: proof_specific_effect
    patterns: ["셀룰라이트", "붓기", "부기", "다크\\s*서클", "피부\\s*혈행", "피부\\s*장벽\\s*(손상|개선|강화|회복)", "피지\\s*(분비)?\\s*조절", "미세\\s*먼지\\s*(차단|흡착)", "여드름성\\s*피부", "(barrier|skin)\\s*repair"]
    category: 효능 과장
    risk: 근거 확인 필요
    reason: "붓기, 다크서클, 피부 장벽, 피지 조절 등의 효과는 인체 적용시험 자료가 있어야 사용할 수 있습니다."
    suggestion: null
    basis: "지침 별표2 p.15"
    source: guideline

  - id: proof_numbers
    patterns: ["\\d+(\\.\\d+)?\\s*%\\s*(개선|증가|감소|향상|효과)", "\\d+\\s*(초|분|시간|일|주|개월)\\s*(만에|후|동안|로|이면|면|보습|흡수|완성|효과|케어|진정)", "\\d+\\s*배", "\\d+\\s*(초|분)\\s*만"]
    category: 수치·임상 표현
    risk: 근거 확인 필요
    reason: "효과를 수치(%, 시간, 배)로 표현하려면 해당 수치를 증명하는 시험 자료가 있어야 합니다."
    suggestion: null
    basis: "지침 별표2 p.16"
    source: guideline

  - id: proof_duration
    patterns: ["하루\\s*종일", "\\d+\\s*시간\\s*(지속|유지)", "(지속|유지)\\s*력", "롱\\s*래스팅", "long[\\s-]*lasting", "all[\\s-]*day"]
    category: 수치·임상 표현
    risk: 근거 확인 필요
    reason: "효과가 오래 지속된다는 표현은 지속 시간을 증명하는 시험 자료가 있어야 사용할 수 있습니다."
    suggestion: null
    basis: "지침 별표2 p.16"
    source: guideline

  - id: proof_comparison
    patterns: ["\\S*[^\\s기]보다\\s*(더\\s*)?(촉촉|순하|순한|가볍|가벼운|빠르|빠른|오래|효과|좋|진하|진한|밝)", "(타사|기존|일반)\\s*(제품|크림|토너|세럼)?\\s*(대비|보다)", "비교\\s*불가"]
    category: 효능 과장
    risk: 근거 확인 필요
    reason: "다른 제품과 비교하는 표현은 비교 대상과 기준을 밝히고 객관적인 자료가 있어야 사용할 수 있습니다."
    suggestion: null
    basis: "지침 별표2 p.16"
    source: guideline

  # "테스트도 완료", "테스트를 마친"처럼 사이에 조사가 들어가는 표현 포함 (11/5 이모티콘 테스트에서 미검출)
  - id: proof_test
    patterns: ["피부과\\s*테스트", "임상", "인체\\s*적용\\s*시험", "(테스트|시험)\\S{0,2}\\s*(완료|통과|마쳤|마친)", "자극\\s*(테스트|시험)", "효과\\s*입증", "검증\\s*완료", "저자극\\s*테스트", "clinically\\s*(proven|tested)", "dermatologist[\\s-]*(tested|approved)"]
    category: 수치·임상 표현
    risk: 근거 확인 필요
    reason: "시험을 했더라도 결과 자료를 갖추지 않으면 '테스트 완료', '임상' 등의 표현을 사용할 수 없습니다."
    suggestion: null
    basis: "지침 별표2 p.16"
    source: guideline

  - id: proof_free_from
    patterns: ["무첨가", "無\\s*\\S+", "무\\s*(파라벤|실리콘|알코올|알콜|향료|색소|설페이트|미네랄\\s*오일|인공\\s*향)", "\\S+\\s*free\\b", "\\S+\\s*프리\\b"]
    category: 소비자 오인
    risk: 근거 확인 필요
    reason: "'무○○' 표현은 해당 성분이 없다는 시험 자료가 있어야 하며, 원래 배합할 수 없는 성분은 '무첨가'로 표현할 수 없습니다."
    suggestion: null
    basis: "지침 별표1 p.13, 별표2 p.16"
    source: guideline

  # 지침 예시의 배합금지 원료만 (목록 전체는 화장품 안전기준 등에 관한 규정 별표1)
  - id: consumer_banned_free
    patterns: ["(無|무)\\s*(스테로이드|벤조피렌)", "(스테로이드|벤조피렌)\\s*(무첨가|프리|free)"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "원래 화장품에 넣을 수 없는 성분(배합금지 원료)을 넣지 않았다고 강조하는 표현은 금지됩니다."
    suggestion: null
    basis: "지침 별표1 p.13"
    source: guideline

  - id: proof_natural
    patterns: ["천연", "유기농", "오가닉", "organic", "\\bnatural\\b"]
    category: 소비자 오인
    risk: 근거 확인 필요
    reason: "천연·유기농 표현은 대한화장품협회 기준에 적합하다는 자료가 있어야 사용할 수 있습니다."
    suggestion: null
    basis: "지침 별표1 p.14, 별표2 p.16"
    source: guideline

  - id: proof_soothing
    patterns: ["진정(?!한|성|으로)", "\\bsoothing\\b", "\\bcalming\\b"]
    category: 의약품 오인
    risk: 근거 확인 필요
    reason: "식약처는 '진정'을 의약품으로 오인할 수 있는 표현의 예로 안내하고 있습니다."
    suggestion: "편안한 / 산뜻한"
    basis: "식약처 뉴스레터 34호"
    source: newsletter_34

  # ---------- 소비자 오인 · 화장품 범위 밖 (제13조 제1항 제4호) ----------
  - id: consumer_institution
    patterns: ["(의사|전문의|피부과|병원|약사|의료진)\\S*\\s*(가|이)?\\s*(추천|개발|인증|공동\\s*개발)", "병원\\s*(용|전용)", "피부과\\s*(전용|시술용)", "약국\\s*(용|전용)", "협회\\s*인증", "(doctor|dermatologist)[\\s-]*recommended"]
    category: 전문가·매체 추천
    risk: 위반 의심
    reason: "의사·약사·병원이 추천하거나 사용하는 제품처럼 보이는 표현은 법으로 금지됩니다."
    suggestion: null
    basis: "지침 별표1 p.13, 시행규칙 별표5 2.다"
    source: guideline

  - id: consumer_procedure
    patterns: ["보톡스", "레이저", "카복시", "시술", "지방\\s*볼륨", "니들", "needle", "미세침", "\\bMTS\\b", "진피층?\\s*(까지)?\\s*침투"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "시술·니들·진피층 침투 등 의료 시술과 유사한 효과를 내세우는 표현은 화장품 범위를 벗어나 금지됩니다."
    suggestion: null
    basis: "지침 별표1 p.13~14"
    source: guideline

  - id: consumer_human_origin
    patterns: ["줄기\\s*세포", "stem\\s*cell", "\\d+\\s*억\\s*세포", "인체\\s*(세포|조직)\\s*배양액", "(?<!식물)(?<!식물 )(?<!우유)(?<!우유 )엑소좀"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "인체에서 유래한 성분이 들어 있는 것처럼 보이는 표현은 금지됩니다. '식물 엑소좀'처럼 유래를 밝히면 사용할 수 있습니다."
    suggestion: null
    basis: "지침 별표1 p.13~14"
    source: guideline

  - id: consumer_no_side_effect
    patterns: ["부작용\\s*(이)?\\s*(전혀\\s*)?없", "먹을\\s*수\\s*있", "명현\\s*현상"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "부작용이 없다거나 먹어도 된다는 표현은 소비자를 오인하게 할 수 있어 금지됩니다."
    suggestion: null
    basis: "지침 별표1 p.13"
    source: guideline

  - id: consumer_mfds
    patterns: ["식약처\\s*(허가|인증|인정|승인)", "식품의약품안전처\\s*(허가|인증|인정|승인)"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "식약처가 허가·인증한 제품처럼 보이는 표현은 금지됩니다. 기능성 심사(보고) 사실은 표현할 수 있습니다."
    suggestion: null
    basis: "지침 별표1 p.14"
    source: guideline

  - id: consumer_skin_age
    patterns: ["피부\\s*나이", "\\d+\\s*(세|살|년)\\s*(어려|젊어|감소)"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "피부 나이가 몇 살 어려진다는 표현은 금지됩니다. 시험 자료가 있으면 '피부노화지수'로 표현할 수 있습니다."
    suggestion: null
    basis: "지침 별표1 p.14, 별표2 p.15"
    source: guideline

  - id: consumer_patent
    patterns: ["특허\\s*출원"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "특허 출원 사실만으로 광고하면 특허받은 제품으로 오인할 수 있습니다. 등록된 특허만 표현할 수 있습니다."
    suggestion: "특허 등록 성분 (등록된 경우만)"
    basis: "2024 질문집 Q290 (p.301~302)"
    source: faq_2024

  - id: consumer_no_animal_test
    patterns: ["동물\\s*실험\\S{0,2}\\s*(미실시|안\\s*함|하지\\s*않)", "크루얼티\\s*프리", "cruelty[\\s-]*free"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "화장품은 법으로 동물실험이 금지되어 있어, 다른 제품은 동물실험을 한 것처럼 오인하게 할 수 있습니다."
    suggestion: null
    basis: "2025 질문집 Q312 (p.201~202)"
    source: faq_2025

  - id: consumer_sexual
    patterns: ["여성\\s*크림", "질\\s*(보습|수축|세정|내)", "이너\\s*케어", "쾌감"]
    category: 소비자 오인
    risk: 위반 의심
    reason: "질 내 사용이나 성 기능을 연상시키는 표현은 화장품 범위를 벗어나 금지됩니다."
    suggestion: null
    basis: "지침 별표1 p.14"
    source: guideline

  # ---------- 순위·최상급 (시행규칙 별표5 2.바) ----------
  - id: rank_superlative
    patterns: ["최고", "최상", "최적(?!\\s*의?\\s*사용)", "최초", "유일", "넘버\\s*원", "No\\.?\\s*1", "\\d+\\s*위"]
    category: 순위·최상급 표현
    risk: 위반 의심
    reason: "'최고', '최상' 등 배타성을 띤 절대적 표현은 법으로 금지됩니다."
    suggestion: "삭제 후 제품 특징으로 구체적으로 (예: 촉촉한, 산뜻한)"
    basis: "시행규칙 별표5 2.바, 2024 질문집 Q310 (p.325)"
    source: enforcement_rule

  - id: rank_must_have
    patterns: ["필수템", "필수\\s*아이템", "인생템", "끝판왕", "완벽"]
    category: 효능 과장
    risk: 근거 확인 필요
    reason: "과장으로 보일 수 있는 표현입니다. 식약처 금지어는 아니지만 서비스 자체 기준으로 확인을 권장합니다."
    suggestion: "데일리템 / 데일리 아이템"
    basis: "자체 기준 (과장 표현)"
    source: null

# ---------- 기능성 분기 (별표 1 제13조 제1항 제2호, 시행규칙 제2조) ----------
# 일반 화장품 → not_functional_risk / 기능성 화장품 → functional_risk
# reason은 기능성 여부·종류에 따라 rule_checker에서 만듦
functional_rules:
  - id: func_whitening
    functional_type: 미백
    patterns: ["미백", "화이트닝", "whitening", "기미", "주근깨", "잡티\\s*(제거|개선|완화)", "멜라닌"]
    category: 기능성 오인
    not_functional_risk: 위반 의심
    functional_risk: 근거 확인 필요
    suggestion: "화사한 / 맑은 (색조는 '톤업')"
    basis: "지침 별표1 p.9, p.12, 별표2 p.15"
    source: guideline

  - id: func_wrinkle
    functional_type: 주름개선
    patterns: ["주름\\s*(개선|완화|감소|예방|케어|제거)", "링클", "wrinkle"]
    category: 기능성 오인
    not_functional_risk: 위반 의심
    functional_risk: 근거 확인 필요
    suggestion: "매끄러운 피부결 / 촉촉한 피부결"
    basis: "지침 별표1 p.12"
    source: guideline

  - id: func_uv
    functional_type: 자외선차단
    patterns: ["자외선\\s*(차단|보호)", "\\bUV\\s*(차단|protection|block)", "SPF\\s*\\d+", "PA\\s*\\+{1,4}", "(?<!개)(선|썬)\\s*(크림|블록|스크린)"]
    category: 기능성 오인
    not_functional_risk: 위반 의심
    functional_risk: 근거 확인 필요
    suggestion: null
    basis: "지침 별표1 p.12"
    source: guideline

  - id: func_acne
    functional_type: 여드름완화
    patterns: ["여드름(?!성\\s*피부)(?!\\s*(흔적|자국))", "트러블\\s*(개선|완화|케어|진정)", "\\bacne\\b"]
    category: 기능성 오인
    not_functional_risk: 위반 의심
    functional_risk: 근거 확인 필요
    suggestion: null
    basis: "지침 별표1 p.9 (여드름완화 기능성은 인체세정용 제품만)"
    source: guideline

  - id: func_hair_loss
    functional_type: 탈모완화
    patterns: ["탈모", "빠지는\\s*(모발|머리카락)"]
    category: 기능성 오인
    not_functional_risk: 위반 의심
    functional_risk: 근거 확인 필요
    suggestion: null
    basis: "지침 별표1 p.10, 별표2 p.15~16"
    source: guideline

  - id: func_itch
    functional_type: 가려움개선
    patterns: ["가려움", "간지러움"]
    category: 기능성 오인
    not_functional_risk: 위반 의심
    functional_risk: 근거 확인 필요
    except_with: ["보습", "일시적"]
    suggestion: "보습으로 건조함에 의한 가려움을 일시적으로 덜어줌"
    basis: "지침 별표1 p.10 (보습을 통한 일시적 완화는 가능)"
    source: guideline

  - id: func_stretch_mark
    functional_type: 튼살붉은선완화
    patterns: ["튼살", "임신선"]
    category: 기능성 오인
    not_functional_risk: 위반 의심
    functional_risk: 근거 확인 필요
    suggestion: null
    basis: "지침 별표1 p.10"
    source: guideline

# ---------- 색조 예외 (제품 종류가 색조일 때만) ----------
# 아래 표현은 같은 문장에 allow_with가 함께 있으면 통과
color_exceptions:
  patterns: ["여드름\\s*(흔적|자국)", "흔적", "홍조", "홍반", "뾰루지", "V\\s*라인", "윤곽", "필러", "filler"]
  allow_with: ["가려", "커버", "연출", "채워"]
  category: 의약품 오인
  risk: 위반 의심
  reason: "피부 증상을 없앤다는 표현은 의약품으로 오인할 수 있어 금지됩니다. 색조 제품의 '가려준다·연출한다·채워준다' 표현은 사용할 수 있습니다."
  basis: "지침 별표1 p.10, p.11, p.13"
  source: guideline