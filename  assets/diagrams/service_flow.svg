<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1680" viewBox="0 0 940 1680" role="img" aria-labelledby="ttl desc">
<title id="ttl">광고 생성 및 표현 검수 처리 흐름</title><desc id="desc">1 제품 정보 입력에서 5 문구 검수까지, 검수 결과의 위반 의심은 승인 차단 후 문구 수정으로 돌아가고, 근거 확인 필요는 경고 후 사용자 검토로 진행하고, 정상은 바로 사용자 검토로 진행한다. 이후 이미지 제작 및 최종 결과까지 순차 처리.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#647B96"/></marker>
 <marker id="redarrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#CB776D"/></marker>
 <style><![CDATA[
