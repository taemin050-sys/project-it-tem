 .subtitle{font-size:16px;fill:#6D7E90;text-anchor:start}
 .big{font-size:21px;font-weight:600}.sub{font-size:17px;fill:#61758B}.branch{font-size:17px;font-weight:600}.micro{font-size:14px;fill:#6F8092}
 .line{fill:none;stroke:#647B96;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
 .retry{fill:none;stroke:#CB776D;stroke-width:2.7;stroke-dasharray:9 8;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#redarrow)}
 ]]></style></defs>
